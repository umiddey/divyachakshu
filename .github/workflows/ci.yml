# PR gate: the full test suite (runs without a real OpenCode — tests/conftest.py
# puts a fake `opencode` on PATH) plus the release version agreement.
name: ci
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: full test suite
        run: uv run pytest -q
      - name: release versions agree
        run: bash scripts/check-release-versions.sh
